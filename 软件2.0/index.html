<script>
/* ========== 全局 fetch 拦截：把 Supabase 请求改写到同域 /api（由 Netlify 转发） ========== */
const SUPABASE_ORIGIN = 'https://lsgcfopolvfcczftvozm.supabase.co';
const originalFetch = window.fetch;
window.fetch = function(input, options) {
  // 只改写 URL，options（含 apikey / Content-Type / Prefer 等 headers）原样透传，不破坏请求头
  let proxied = false;
  if (typeof input === 'string') {
    if (input.startsWith(SUPABASE_ORIGIN)) {
      input = input.replace(SUPABASE_ORIGIN, window.location.origin + '/api');
      proxied = true;
    }
  } else if (input && typeof input.url === 'string' && input.url.startsWith(SUPABASE_ORIGIN)) {
    input = new Request(input.url.replace(SUPABASE_ORIGIN, window.location.origin + '/api'), input);
    proxied = true;
  }
  return originalFetch(input, options).then((resp) => {
    if (proxied && !resp.ok) {
      resp.clone().text().then((txt) => {
        console.error('[代理调试] 状态码', resp.status, '响应体', txt ? txt.slice(0, 800) : '(空)');
      });
    }
    return resp;
  });
};

/* ========== 常量与状态 ========== */

/* ========== 工具 ========== */
const $ = (sel) => document.querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dateStr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => dateStr(new Date());
const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dateStr(d); };
const fmtDate = (s) => { const p = s.split('-'); return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日'; };

/* 倒计时标签：逾期红 / 不足24h 橙 / 超过24h 蓝 */
function dueLabel(dueAt) {
  if (!dueAt) return '';
  const ms = new Date(dueAt).getTime() - Date.now();
  if (isNaN(ms)) return '';
  if (ms <= 0) {
    return '<span class="flex-none text-xs font-semibold px-2 py-1 rounded bg-red-100 text-red-600">已逾期</span>';
  }
  if (ms < 86400000) {
    const hours = Math.ceil(ms / 3600000);
    return '<span class="flex-none text-xs font-semibold px-2 py-1 rounded bg-orange-100 text-orange-600">剩余 ' + hours + ' 小时</span>';
  }
  const days = Math.floor(ms / 86400000);
  return '<span class="flex-none text-xs font-semibold px-2 py-1 rounded bg-blue-100 text-blue-600">剩余 ' + days + ' 天</span>';
}

/* 发布人显示：学号转姓名，空则显示“班委” */
function displayName(v) {
  if (!v) return '班委';
  const found = roster.find(u => u.id === v);
  return found ? found.name : v;
}

/* ========== localStorage（try/catch 兜底，兼容追踪防护拦截） ========== */
function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignore */ } }
function lsRemove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }
function loadUser() { try { return JSON.parse(lsGet(USER_KEY)); } catch (e) { return null; } }
function saveUser(u) { lsSet(USER_KEY, JSON.stringify(u)); }
/* 强制校验登录态：只认 localStorage，防篡改；未登录直接退回登录页 */
function requireLogin() {
  const user = loadUser();
  if (!user || !user.student_id || !user.name) {
    alert('请先登录');
    showLogin();
    return null;
  }
  currentUser = user; // 以 localStorage 为准，覆盖内存
  return user;
}
function clearUser() { lsRemove(USER_KEY); }
function loadData(key, def) { try { const v = lsGet(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function saveData(key, val) { lsSet(key, JSON.stringify(val)); }

/* ========== 角色 ========== */
const isStaff = () => !!currentUser && (currentUser.role === 'admin' || currentUser.role === 'super_admin');
const isSuperAdmin = () => !!currentUser && currentUser.role === 'super_admin';
const roleLabel = (r) => r === 'super_admin' ? '班长' : r === 'admin' ? '班委' : '同学';

/* 是否本人发布（兼容 created_by 存姓名或学号） */
function isMine(item) {
  if (!currentUser) return false;
  const cb = (item && item.created_by) || '';
  return cb === currentUser.name || cb === currentUser.student_id;
}
/* 任务/提醒的编辑删除权限：班长全部，班委仅本人，同学不可 */
function canManage(item) {
  if (!currentUser) return false;
  if (currentUser.role === 'super_admin') return true;
  if (currentUser.role === 'admin') return isMine(item);
  return false;
}
/* 更新教室权限：班长 或 黄钰琪(08265393) */
function canUpdateRooms() {
  if (!currentUser) return false;
  return currentUser.role === 'super_admin' || currentUser.name === '黄钰琪' || currentUser.student_id === '08265393';
}

/* ========== Toast ========== */
let toastTimer = null;
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-8 z-[60] px-5 py-2.5 rounded-xl text-white text-sm shadow-lg max-w-[90vw] text-center transition ' + (isErr ? 'bg-rose-600' : 'bg-slate-800');
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
}

/* ========== 视图切换 ========== */
function showLogin() {
  $('#loginScreen').classList.remove('hidden');
  $('#app').classList.add('hidden');
}
function showApp() {
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  render();
  loadTasks();
  loadReminders();
  loadRooms();
  refreshMyRole(); // 进主页立即同步一次最新身份
  startPolling();
}

/* ========== 静默轮询（伪实时，3 秒一次） ========== */
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (pollingBusy) return;
    pollingBusy = true;
    try {
      await Promise.all([loadTasks(true), loadReminders(true), loadRooms(true), refreshMyRole()]);
    } catch (e) {
      console.warn('轮询异常：', e);
    } finally {
      pollingBusy = false;
    }
  }, 3000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

/* ========== 登录 / 退出 ========== */
function showLoginError(msg) {
  const err = $('#loginErr');
  if (!err) return;
  if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
  else { err.textContent = ''; err.classList.add('hidden'); }
}

function login() {
  const sid = $('#loginStudentId').value.trim();
  const name = $('#loginName').value.trim();
  const phone = $('#loginPhone').value.trim();

  if (!sid || !name || !phone) { showLoginError('请填写学号、姓名和手机号'); return; }
  if (!/^\d+$/.test(sid)) { showLoginError('学号只能包含数字'); return; }
  if (phone.length !== 11) { showLoginError('手机号需为 11 位数字'); return; }

  showLoginError('');

  // 纯前端比对，不发任何网络请求
  const matched = roster.find(u => u.id === sid && u.name === name && u.phone === phone);
  if (matched) {
    currentUser = { student_id: matched.id, name: matched.name, role: matched.role };
    saveUser(currentUser);
    alert('登录成功');
    showApp();
  } else {
    alert('信息不匹配');
  }
}

function logout() {
  stopPolling();
  clearUser();
  currentUser = null;
  showLogin();
  toast('已退出登录');
}

/* ========== 渲染 ========== */
function render() {
  const role = currentUser ? currentUser.role : '';
  $('#navUser').textContent = currentUser ? ('当前用户：' + currentUser.name + '（' + roleLabel(currentUser.role) + '）') : '';
  // 发布类按钮：班长 + 班委 可见
  const canPublish = (role === 'super_admin' || role === 'admin');
  $('#addTaskBtn').classList.toggle('hidden', !canPublish);
  $('#addReminderBtn').classList.toggle('hidden', !canPublish);
  // 更新教室：仅班长 或 黄钰琪
  $('#updateRoomBtn').classList.toggle('hidden', !canUpdateRooms());
  // 班委管理按钮：仅班长可见
  const isSuper = (role === 'super_admin');
  $('#adminBtn').classList.toggle('hidden', !isSuper);
  renderTasks();
  renderReminders();
  renderRooms();
}

/* ========== 待办任务 ========== */
function renderTasks() {
  const list = $('#taskList');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="text-center text-sm text-slate-400 py-8 bg-white rounded-2xl border border-dashed border-slate-200">暂无任务</div>';
    return;
  }
  const doneIds = loadCompleted();
  // 已完成的排到列表后面
  const ordered = tasks.slice().sort((a, b) => {
    const da = doneIds.indexOf(a.id) !== -1 ? 1 : 0;
    const db = doneIds.indexOf(b.id) !== -1 ? 1 : 0;
    return da - db;
  });
  list.innerHTML = ordered.map(t => {
    const done = doneIds.indexOf(t.id) !== -1;
    const circle = done
      ? '<button data-act="toggle" data-id="' + t.id + '" title="取消打卡" class="flex-none w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs font-bold">✓</button>'
      : '<button data-act="toggle" data-id="' + t.id + '" title="标记完成" class="flex-none w-6 h-6 rounded-full border-2 border-slate-300 hover:border-emerald-400"></button>';
    const badge = '<span class="flex-none text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">' + esc(t.category || '作业') + '</span>';
    const due = dueLabel(t.due_at);
    const canManageThis = canManage(t);
    const edit = canManageThis
      ? '<button data-act="edit" data-id="' + t.id + '" class="flex-none text-indigo-500 hover:text-indigo-700 text-sm font-semibold px-1">编辑</button>'
      : '';
    const del = canManageThis

function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ========== 班委管理 ========== */
function openAdmin() {
  if (!currentUser || currentUser.role !== 'super_admin') { alert('无权限操作'); return; }
  $('#adminModal').classList.remove('hidden');
  $('#adminSearch').value = '';
  adminChanges = {};
  loadAdminList();
}
function closeAdmin() {
  $('#adminModal').classList.add('hidden');
}
async function loadAdminList() {
  const list = $('#adminList');
  list.innerHTML = '<div class="text-center text-sm text-slate-400 py-6">加载中…</div>';
  try {
    const { data, error } = await supabaseClient.from('class_roster').select('student_id, name, role');
    if (error) {
      alert('班委列表加载失败：' + JSON.stringify(error));
      list.innerHTML = '<div class="text-center text-sm text-rose-500 py-6">加载失败：' + esc(error.message || error.details || '未知错误') + '</div>';
      return;
    }
    adminUsers = data || [];
    adminChanges = {};
    renderAdminList();
  } catch (err) {
    alert('班委列表加载失败：' + JSON.stringify(err));
    list.innerHTML = '<div class="text-center text-sm text-rose-500 py-6">加载失败</div>';
  }
}
function renderAdminList() {
  const list = $('#adminList');
  const q = $('#adminSearch').value.trim().toLowerCase();
  const selfId = currentUser ? currentUser.student_id : '';
  const rows = adminUsers.filter(u =>
    !q || ((u.name || '').toLowerCase().includes(q)) || ((u.student_id || '').toLowerCase().includes(q))
  ).sort((a, b) => {
    const ra = a.role === 'super_admin' ? 0 : 1, rb = b.role === 'super_admin' ? 0 : 1;
    return ra - rb || (a.student_id || '').localeCompare(b.student_id || '');
  });
  if (rows.length === 0) {
    list.innerHTML = '<div class="text-center text-sm text-slate-400 py-6">没有匹配的同学</div>';
    return;
  }
  list.innerHTML = rows.map(u => {
    const isSelf = u.student_id === selfId;
    let roleCell;
    if (u.role === 'super_admin') {
      roleCell = '<span class="flex-none px-2.5 py-1 rounded-lg bg-rose-100 text-rose-600 text-xs font-bold">班长(super_admin)</span>';
    } else {
      const cur = adminChanges[u.student_id] || u.role;
      roleCell = '<select data-sid="' + esc(u.student_id) + '" class="flex-none px-2 py-1 rounded-lg border border-slate-200 text-sm outline-none focus:border-indigo-500">' +
        '<option value="member"' + (cur === 'member' ? ' selected' : '') + '>同学(member)</option>' +
        '<option value="admin"' + (cur === 'admin' ? ' selected' : '') + '>班委(admin)</option>' +
      '</select>';
    }
    return '<div class="flex items-center gap-3 py-3">' +
      '<div class="flex-1 min-w-0">' +
        '<div class="font-semibold text-slate-800 truncate">' + esc(u.name || '未填写') + (isSelf ? ' <span class="text-rose-500">（我）</span>' : '') + '</div>' +
        '<div class="text-xs text-slate-500">学号 ' + esc(u.student_id || '-') + '</div>' +
      '</div>' + roleCell + '</div>';
  }).join('');
}
function onAdminRoleChange(sel) {
  const sid = sel.getAttribute('data-sid');
  const newRole = sel.value;
  const u = adminUsers.find(x => x.student_id === sid);
  if (u && u.role === newRole) delete adminChanges[sid];
  else adminChanges[sid] = newRole;
}
async function saveAdminRoles() {
  if (!currentUser || currentUser.role !== 'super_admin') { alert('无权限操作'); return; }
  const ids = Object.keys(adminChanges);
  if (ids.length === 0) { toast('没有需要保存的修改'); return; }
  const btn = $('#adminSaveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    for (const sid of ids) {
      const res = await supabaseClient.from('class_roster').update({ role: adminChanges[sid] }).eq('student_id', sid);
      if (res.error) throw res.error;
    }
    toast('已保存 ' + ids.length + ' 项修改');
    await loadAdminList();
  } catch (error) {
    alert('失败原因：' + JSON.stringify(error));
  } finally {
    btn.disabled = false; btn.textContent = '保存修改';
  }
}

/* ========== 同步当前用户角色（以数据库为准） ========== */
async function refreshMyRole() {
  if (!supabaseClient || !currentUser || !currentUser.student_id) return;
  try {
    const { data, error } = await supabaseClient
      .from('class_roster')
      .select('role')
      .eq('student_id', currentUser.student_id)
      .maybeSingle();
    if (error) { console.warn('同步角色失败：', error); return; }
    if (data && data.role && data.role !== currentUser.role) {
      const oldLabel = roleLabel(currentUser.role);
      currentUser.role = data.role;
      saveUser(currentUser);
      render();
      toast('身份已更新：' + oldLabel + ' → ' + roleLabel(currentUser.role));
    }
  } catch (e) {
    console.warn('同步角色异常：', e);
  }
}

/* ========== 事件绑定（全部 addEventListener，无内联 onclick） ========== */
function bindEvents() {
  document.getElementById('loginBtn').addEventListener('click', (e) => { e.preventDefault(); login(); });
  document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); login(); });
  document.getElementById('loginStudentId').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); });
  document.getElementById('loginPhone').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('adminBtn').addEventListener('click', openAdmin);
  document.getElementById('addTaskBtn').addEventListener('click', openTaskForm);
  document.getElementById('addReminderBtn').addEventListener('click', openReminderForm);
  document.getElementById('updateRoomBtn').addEventListener('click', openRoomForm);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('adminClose').addEventListener('click', closeAdmin);
  document.getElementById('adminSaveBtn').addEventListener('click', saveAdminRoles);
  document.getElementById('adminSearch').addEventListener('input', () => renderAdminList());

  document.getElementById('taskList').addEventListener('click', (e) => {
    const toggleBtn = e.target.closest('[data-act="toggle"]');
    if (toggleBtn) { e.preventDefault(); toggleTaskDone(toggleBtn.getAttribute('data-id')); return; }
    const editBtn = e.target.closest('[data-act="edit"]');
    if (editBtn) { const t = tasks.find(x => x.id === editBtn.getAttribute('data-id')); if (t) openTaskEdit(t); return; }
    const delBtn = e.target.closest('[data-act="del"]');
    if (delBtn) deleteTask(delBtn.getAttribute('data-id'));
  });
  document.getElementById('reminderList').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-act="edit"]');
    if (editBtn) { const r = reminders.find(x => x.id === editBtn.getAttribute('data-id')); if (r) openReminderEdit(r); return; }
    const btn = e.target.closest('[data-act="del"]');
    if (btn) deleteReminder(btn.getAttribute('data-id'));
  });
  document.getElementById('adminList').addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-sid]');
    if (sel) onAdminRoleChange(sel);
  });

  document.getElementById('modal').addEventListener('click', (e) => { if (e.target === document.getElementById('modal')) closeModal(); });
  document.getElementById('adminModal').addEventListener('click', (e) => { if (e.target === document.getElementById('adminModal')) closeAdmin(); });
}

// 脚本位于 body 末尾，DOM 已就绪，直接绑定并初始化
bindEvents();
init();
</script>
</body>
</html>
